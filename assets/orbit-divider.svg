<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Animated orbit divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
    <filter id="dividerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M0 32 H1200" stroke="url(#line)" stroke-width="2"/>
  <g filter="url(#dividerGlow)">
    <circle r="5" fill="#67e8f9">
      <animate attributeName="cx" values="120;1080;120" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="32;32;32" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#c4b5fd">
      <animate attributeName="cx" values="1080;120;1080" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="32;32;32" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
